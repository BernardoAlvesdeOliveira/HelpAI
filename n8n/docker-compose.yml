services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - QUEUE_BULL_REDIS_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_REDIS_PORT=6379

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      - redis

    networks:
      - app-network


  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=change-this-to-a-strong-key

      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@postgres:5432/evolution

      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1

    depends_on:
      - postgres
      - redis

    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - app-network


  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_password
      - POSTGRES_DB=evolution

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  n8n_data:
  redis_data:
  postgres_data: